<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    text-align: center;
    padding: 2rem;
  }
  .card {
    max-width: 32rem;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 1.1rem;
    color: #94a3b8;
    line-height: 1.6;
  }
  a.button {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.75rem 1.5rem;
    background: #38bdf8;
    color: #0f172a;
    text-decoration: none;
    border-radius: 0.5rem;
    font-weight: 600;
  }
  a.button:hover {
    background: #0ea5e9;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, world 👋</h1>
    <p>This is a simple one page website. Edit index.html to make it your own.</p>
    <a class="button" href="https://claude.ai" target="_blank" rel="noopener">Learn more</a>
  </div>
</body>
</html>
